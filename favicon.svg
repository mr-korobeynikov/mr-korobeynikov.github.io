<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Phosphor Glow Filter -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="crt-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1622" />
      <stop offset="100%" stop-color="#06090e" />
    </radialGradient>
  </defs>

  <!-- Badge Container with Neon Emerald Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#crt-bg)" stroke="#10b981" stroke-width="2.5" filter="url(#emerald-glow)" />

  <!-- Inner CRT terminal line decor -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#059669" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Shell Prompt '>_' Symbol -->
  <path d="M14 18 L22 23 L14 28" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#emerald-glow)" />
  <rect x="26" y="26" width="8" height="2.5" fill="#34d399" rx="0.5" filter="url(#emerald-glow)" />

  <!-- Stylized WordPress Monogram 'W' with Terminal Line Cuts -->
  <path d="M18 36 L24 50 L30 38 L34 50 L46 36" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#emerald-glow)" />
  
  <!-- Subtle cursor blink dot in top right -->
  <circle cx="49" cy="18" r="2.5" fill="#34d399" filter="url(#emerald-glow)" />
</svg>
